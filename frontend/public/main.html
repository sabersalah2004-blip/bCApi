<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>User Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
</head>
<body>
  <div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      
      <h2>User Management</h2>
      <div>
        <a href="add-user.html" class="btn btn-primary me-2">Add User</a>
        <button id="logoutBtn" class="btn btn-outline-danger">Logout</button>
      </div>
    </div>

    <div id="alert-placeholder"></div>

    <table class="table table-striped" id="usersTable">
      <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Username</th>
          <th>Email</th>
          <th>First Name</th>
          <th>Last Name</th>
          <th>Role</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    // Redirect to login if token is missing
    function checkAuth() {
      const token = localStorage.getItem('token');
      if (!token) window.location.href = 'login.html';
      return token;
    }

    // Generate role badge
    function getRoleBadge(role) {
      const roleColors = {
        admin: 'danger',
        moderator: 'warning',
        user: 'secondary'
      };
      return `<span class="badge bg-${roleColors[role] || 'secondary'}">${role}</span>`;
    }

    // Generate status badge
    function getStatusBadge(status) {
      const statusColors = {
        active: 'success',
        pending: 'info',
        inactive: 'secondary'
      };
      return `<span class="badge bg-${statusColors[status] || 'info'}">${status}</span>`;
    }

    // Render user rows
    function renderUsers(users) {
      const tbody = $('#usersTable tbody').empty();
      users.forEach(user => {
        const row = `
          <tr>
            <td>${user._id}</td>
            <td>${user.username}</td>
            <td>${user.email}</td>
            <td>${user.firstName}</td>
            <td>${user.lastName}</td>
            <td>${getRoleBadge(user.role)}</td>
            <td>${getStatusBadge(user.status)}</td>
            <td>
              <button class="btn btn-info btn-sm btn-view" data-id="${user._id}">View</button>
            </td>
          </tr>
        `;
        tbody.append(row);
      });
    }

    // Fetch users from API
    function fetchUsers() {
      const token = checkAuth();
      $.ajax({
        url: 'http://localhost:5000/users',
        method: 'GET',
        headers: { Authorization: `Bearer ${token}` },
        success: renderUsers,
        error: function(xhr) {
          if (xhr.status === 401) {
            window.location.href = 'login.html';
          } else {
            $('#alert-placeholder').html('<div class="alert alert-danger">Failed to load users</div>');
          }
        }
      });
    }



    // Event bindings
    $(function() {
      fetchUsers();

      $('#usersTable').on('click', '.btn-view', function() {
        const userId = $(this).data('id');
        window.location.href = `user-details.html?id=${userId}`;
      });

      $('#logoutBtn').on('click', function() {
        localStorage.removeItem('token');
        window.location.href = 'login.html';
      });
    });

    
  </script>
</body>
</html>
