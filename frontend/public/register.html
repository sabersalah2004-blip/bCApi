<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
</head>
<body>
  <div class="container mt-5" style="max-width: 500px;">
    <h2 class="mb-4">Register</h2>
    <div id="alert-placeholder"></div>
    <form id="registerForm">
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input type="text" id="username" class="form-control" required minlength="3" />
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" id="email" class="form-control" required />
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" class="form-control" required minlength="6" />
      </div>
      <div class="mb-3">
        <label for="firstName" class="form-label">First Name</label>
        <input type="text" id="firstName" class="form-control" required />
      </div>
      <div class="mb-3">
        <label for="lastName" class="form-label">Last Name</label>
        <input type="text" id="lastName" class="form-control" required />
      </div>
      <div class="mb-3">
        <label for="role" class="form-label">Role</label>
        <select id="role" class="form-select">
          <option value="user" selected>User</option>
          <option value="moderator">Moderator</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <button type="submit" class="btn btn-success w-100">Register</button>
    </form>
    <p class="mt-3">Already have an account? <a href="login.html">Login here</a></p>
  </div>

  <script>
    $(function() {
      $('#registerForm').submit(function(e) {
        e.preventDefault();
        $('#alert-placeholder').html('');
        const data = {
          username: $('#username').val(),
          email: $('#email').val(),
          password: $('#password').val(),
          firstName: $('#firstName').val(),
          lastName: $('#lastName').val(),
          role: $('#role').val()
        };
        $.ajax({
          url: 'http://localhost:5000/register',
          method: 'POST',
          contentType: 'application/json',
          data: JSON.stringify(data),
          success: function(resp) {
            $('#alert-placeholder').html('<div class="alert alert-success">Registration successful. Redirecting to login...</div>');
            setTimeout(() => window.location.href = 'login.html', 2000);
          },
          error: function(xhr) {
            const errors = xhr.responseJSON?.errors;
            if(errors) {
              const msgs = errors.map(e => e.msg).join('<br>');
              $('#alert-placeholder').html(`<div class="alert alert-danger">${msgs}</div>`);
            } else {
              const err = xhr.responseJSON?.error || 'Registration failed';
              $('#alert-placeholder').html(`<div class="alert alert-danger">${err}</div>`);
            }
          }
        });
      });
    });
  </script>
</body>
</html>
